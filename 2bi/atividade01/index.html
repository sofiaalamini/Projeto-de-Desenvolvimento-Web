<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de produtos</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="cabecalho">
            <div>
                <p class="etiqueta">Atividade 01 · 2º bimestre</p>
                <h1>Catálogo de produtos</h1>
                <p>Explore os primeiros 12 produtos disponíveis na DummyJSON.</p>
            </div>
            <button id="carregar" type="button">Carregar produtos</button>
        </header>

        <p id="mensagem" class="mensagem" role="status" aria-live="polite">Clique no botão para carregar os produtos.</p>
        <section id="produtos" class="grade" aria-label="Produtos"></section>
    </main>
</body>
</html>
