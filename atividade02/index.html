<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de cadastro</title>
</head>

<body>
    <h1>Página de Cadastro</h1>
    <form>
        <fieldset>
            <legend>Crie sua conta</legend>
            <p>

                <label for="nome">Nome:</label><br>
                <input type="text" id="nome" name="nome">
            </p>
            <p>
                <label for="email">E-mail:</label><br>
                <input type="email" name="email" id="email" placeholder="seuemail@dominio.com" required>
            </p>
            <p>
                <label for="senha">Senha (mínimo 8 caracteres):</label><br>
                <input type="password" name="senha" id="senha" minlength="8" required>
            </p>
            <p><strong>Gênero:</strong></p>
                <input type="radio" id="masculino" name="genero" value="masculino">
                <label for="masculino">Masculino</label><br>

                <input type="radio" id="feminino" name="genero" value="feminino">
                <label for="feminino">Feminino</label><br>

                <input type="radio" id="outro" name="genero" value="outro">
                <label for="outro">Outro</label><br>
            <br>
            <p>
                <label for="biografia">Biografia:</label><br>
                <textarea name="biografia" id="biografia" rows="5"
                    placeholder="Conte um pouco sobre você..."></textarea>
            </p>
            <p>
                <input type="checkbox" name="termos" id="termos">
                <label for="termos">Concordo com os termos de uso</label>
            </p>
        </fieldset>
        <br>
        <button type="submit">Cadastrar</button>
        <button type="submit">Limpar</button>
    </form>

</body>

</html>
